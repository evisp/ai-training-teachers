site_name: IA për mësuesit
site_description: Udhëzues praktik për përdorimin e inteligjencës artificiale në klasë
site_author: Evis Plaku
site_url: https://evisp.github.io/ai-training-teachers/
repo_url: https://github.com/evisp/ai-training-teachers
repo_name: evisp/ai-training-teachers
copyright: "&copy; 2026 Evis Plaku"

theme:
  name: material
  language: custom
  custom_dir: overrides
  font:
    text: Lexend
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Kalo në modalitetin e errët
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Kalo në modalitetin e ndriçuar
  icon:
    logo: material/school-outline
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Kreu: index.md
  - Bazat:
      - bazat/index.md
      - Çfarë është IA: bazat/cfare-eshte-ia.md
      - Mjetet kryesore të IA-së: bazat/mjetet-e-ia.md
      - Etika e IA-së: bazat/etika-e-ia.md
  - Trajnimi:
      - trajnimi/index.md
      - Demo e hapjes: trajnimi/demo.md
      - Misionet: trajnimi/misionet.md
      - Pas trajnimit: trajnimi/pas-trajnimit.md
  - Biblioteka e prompteve:
      - prompte/index.md
      - Planifikimi dhe aktivitetet: prompte/planifikimi.md
      - Diferencimi dhe përshtatja: prompte/diferencimi.md
      - Vlerësimi dhe komentet: prompte/vleresimi.md
      - Komunikimi: prompte/komunikimi.md
      - Kontrolli dhe përmirësimi: prompte/kontrolli.md
      - Nga trajnimi: prompte/nga-trajnimi.md
      - Kartela për printim: prompte/kartela.md
  - Burime:
      - Fjalori: burime/fjalori.md
      - Pyetje të shpeshta: burime/pyetje-te-shpeshta.md

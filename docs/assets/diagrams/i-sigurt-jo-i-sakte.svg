<text x="518" y="94" font-size="13" class="f-soft">Ky studim nuk ekziston.</text>
<rect x="120" y="242" width="170" height="42" rx="21" class="f-sagesoft s-line"/>
<text x="205" y="269" text-anchor="middle" font-size="15" class="f-ink t-title">Ton i sigurt</text>
<text x="340" y="273" text-anchor="middle" font-size="28" class="f-red t-title">≠</text>
<rect x="390" y="242" width="190" height="42" rx="21" class="f-hl s-pencil"/>
<text x="485" y="269" text-anchor="middle" font-size="15" class="f-ink t-title">Përgjigje e saktë</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Modeli parashikon fjalën e radhës: lexojnë 58 për qind, shkruajnë 22, flasin 9, këndojnë 3">
<text x="496" y="52" text-anchor="end" font-size="20" class="f-ink">Nxënësit hapën librat dhe filluan të</text>

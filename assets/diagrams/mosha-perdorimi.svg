<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="Përdorimi i IA-së sipas moshës: në fillor IA në duart e mësuesit, në të mesmen e ulët përdorim i udhëhequr, në të mesmen e lartë përdorim me rregulla">
<text x="20" y="28" font-size="12.5" class="f-soft">Më shumë pavarësi për nxënësin</text>
<path d="M214 24 H 640" class="f-none s-soft" stroke-width="1.4" stroke-dasharray="4 5"/>
<polygon points="638,19 648,24 638,29" class="f-soft"/>
<g class="f-sagesoft s-line" stroke-width="1.2"><rect x="20" y="150" width="200" height="130" rx="14"/><rect x="240" y="100" width="200" height="180" rx="14"/><rect x="460" y="50" width="200" height="230" rx="14"/></g>
<g class="f-paper s-line" stroke-width="1"><rect x="34" y="164" width="130" height="24" rx="12"/><rect x="254" y="114" width="172" height="24" rx="12"/><rect x="474" y="64" width="178" height="24" rx="12"/></g>
<g font-size="11.5" class="f-ink"><text x="46" y="180">Fillor, kl. 1–5</text><text x="266" y="130">I mesëm i ulët, kl. 6–9</text><text x="486" y="80">I mesëm i lartë, kl. 10–12</text></g>
<g font-size="14.5" class="f-ink t-title"><text x="36" y="218">IA në duart e mësuesit</text><text x="256" y="168">Përdorim i udhëhequr</text><text x="476" y="118">Përdorim me rregulla</text></g>
<g font-size="12.5" class="f-soft"><text x="36" y="241">Mësuesi demonstron,</text><text x="36" y="260">nxënësit mendojnë.</text><text x="256" y="191">Mjete të lejuara për</text><text x="256" y="210">moshën, me leje prindi.</text><text x="476" y="141">Nxënësit punojnë vetë,</text><text x="476" y="160">me transparencë.</text></g>
</svg>

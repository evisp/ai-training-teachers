<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img" aria-label="Shkalla e përdorimit të IA-së në detyra, nga 0 pa IA deri në 4 IA e lirë me transparencë">
<g class="s-line" stroke-width="1.2"><rect x="8" y="10" width="124" height="170" rx="12" class="f-paper"/><rect x="142" y="10" width="124" height="170" rx="12" class="f-sagesoft" fill-opacity="0.35"/><rect x="276" y="10" width="124" height="170" rx="12" class="f-sagesoft" fill-opacity="0.6"/><rect x="410" y="10" width="124" height="170" rx="12" class="f-sagesoft" fill-opacity="0.85"/><rect x="544" y="10" width="124" height="170" rx="12" class="f-sagesoft"/></g>
<g class="f-pencil"><circle cx="36" cy="40" r="15"/><circle cx="170" cy="40" r="15"/><circle cx="304" cy="40" r="15"/><circle cx="438" cy="40" r="15"/><circle cx="572" cy="40" r="15"/></g>
<g font-size="15" font-weight="700" fill="#1d1d1d" text-anchor="middle"><text x="36" y="45">0</text><text x="170" y="45">1</text><text x="304" y="45">2</text><text x="438" y="45">3</text><text x="572" y="45">4</text></g>
<g font-size="13.5" class="f-ink t-title"><text x="22" y="86">Pa IA</text><text x="156" y="86">IA për ide</text><text x="290" y="86">IA për</text><text x="290" y="104">përmirësim</text><text x="424" y="86">IA si</text><text x="424" y="104">bashkëpunëtor</text><text x="558" y="86">IA e lirë</text></g>
<g font-size="11.5" class="f-soft"><text x="22" y="136">Puna është</text><text x="22" y="153">vetëm e nxënësit.</text><text x="156" y="136">Ide dhe plan,</text><text x="156" y="153">jo tekst i gatshëm.</text><text x="290" y="136">Korrigjim gjuhe</text><text x="290" y="153">dhe strukture.</text><text x="424" y="136">Drafte të</text><text x="424" y="153">përbashkëta.</text><text x="558" y="136">Çdo përdorim,</text><text x="558" y="153">me transparencë.</text></g>
<path d="M20 205 H 650" class="f-none s-sage" stroke-width="2"/>
<polygon points="648,199 660,205 648,211" class="f-sage"/>
<text x="20" y="226" font-size="12" class="f-soft">më pak IA</text>
<text x="660" y="226" font-size="12" text-anchor="end" class="f-soft">më shumë IA</text>
</svg>

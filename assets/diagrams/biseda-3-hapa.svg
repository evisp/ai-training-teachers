<g font-size="12.5" class="f-soft"><text x="36" y="94">Shkruani çfarë ju duhet</text><text x="36" y="113">dhe për kë është.</text><text x="266" y="94">Kontrolloni faktet,</text><text x="266" y="113">nivelin dhe tonin.</text><text x="496" y="94">Kërkoni ndryshime</text><text x="496" y="113">derisa t'ju pëlqejë.</text></g>

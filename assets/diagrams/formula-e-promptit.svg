<g font-size="12" class="f-soft" text-anchor="middle"><text x="87" y="70">Kush është IA?</text><text x="255" y="70">Çfarë kërkoni?</text><text x="423" y="70">Për kë, sa, si?</text><text x="591" y="70">Si duket përgjigjja?</text></g>

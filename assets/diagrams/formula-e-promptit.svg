<g font-size="13.5" class="f-ink"><text x="134" y="144">Vepro si mësues/e me përvojë i/e biologjisë.</text><text x="134" y="174">Krijo një plan mësimi për fotosintezën</text><text x="134" y="204">për klasën e 7-të, për një orë 45-minutëshe,</text><text x="134" y="234">si tabelë: koha, aktiviteti, çfarë bëjnë nxënësit.</text></g>

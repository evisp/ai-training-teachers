<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="Anatomia e një mesazhi për prindërit: përshëndetja dhe arsyeja, çfarë ndodh, si mund të ndihmoni, mbyllja">

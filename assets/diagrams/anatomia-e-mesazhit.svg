<g font-size="13" font-weight="700" fill="#1d1d1d" text-anchor="middle"><text x="384" y="65">1</text><text x="384" y="125">2</text><text x="384" y="193">3</text><text x="384" y="247">4</text></g>
<g font-size="14" class="f-ink t-title"><text x="408" y="56">Përshëndetja dhe arsyeja</text><text x="408" y="116">Çfarë ndodh</text><text x="408" y="184">Si mund të ndihmoni</text><text x="408" y="238">Mbyllja</text></g>
<g font-size="12" class="f-soft"><text x="408" y="74">pse po shkruani, në një fjali</text><text x="408" y="134">aktiviteti, data, çfarë pritet</text><text x="408" y="202">një hap i thjeshtë për në shtëpi</text><text x="408" y="256">kontakti dhe një fjalë e ngrohtë</text></g>
</svg>

<rect x="40" y="40" width="260" height="40" rx="8" class="f-sagesoft"/>
<rect x="40" y="92" width="260" height="56" rx="8" class="f-hl"/>
<rect x="40" y="160" width="260" height="56" rx="8" class="f-skysoft"/>
<rect x="40" y="228" width="260" height="28" rx="8" class="f-sagesoft"/>
<g class="f-ink" opacity="0.22"><rect x="54" y="52" width="150" height="6" rx="3"/><rect x="54" y="64" width="110" height="6" rx="3"/><rect x="54" y="104" width="220" height="6" rx="3"/><rect x="54" y="117" width="196" height="6" rx="3"/><rect x="54" y="130" width="150" height="6" rx="3"/><rect x="54" y="172" width="210" height="6" rx="3"/><rect x="54" y="185" width="180" height="6" rx="3"/><rect x="54" y="198" width="120" height="6" rx="3"/><rect x="54" y="239" width="140" height="6" rx="3"/></g>
<g class="f-none s-soft" stroke-width="1" stroke-dasharray="3 4"><line x1="322" y1="60" x2="366" y2="60"/><line x1="322" y1="120" x2="366" y2="120"/><line x1="322" y1="188" x2="366" y2="188"/><line x1="322" y1="242" x2="366" y2="242"/></g>
